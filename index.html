<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
  <meta name="theme-color" content="#1E3FB8"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mundial 2026"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Expedición Mundial · USA 2026</title>

  <!-- PWA manifest + icons -->
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      background: #0A1430; color: #fff;
      min-height: 100vh; min-height: 100dvh;
      overscroll-behavior: none;
    }
    body { overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Inter Tight', 'Inter', -apple-system, system-ui, sans-serif; margin: 0; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; }
    *::-webkit-scrollbar { height: 0; width: 0; }
    #root { min-height: 100vh; min-height: 100dvh; }

    /* Pulse animation for user location pin */
    @keyframes userpulse {
      0%   { transform: scale(0.95); opacity: 0.8; }
      50%  { transform: scale(1.6);  opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .em-spin { animation: spin 0.9s linear infinite; }

    /* iOS safe-area aware bottom padding for fixed nav */
    .em-safe-bottom { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    .em-safe-top    { padding-top: max(20px, env(safe-area-inset-top)); }

    /* Google Maps marker label cleanup */
    .gm-style-iw-c { padding: 0 !important; }
    .gm-ui-hover-effect { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Production builds of React (faster than dev) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Google Maps async, language ES, with Places + Routes libraries -->
  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "AIzaSyCUeZyKs2jjtKLNIwHq9V7Caw2bW_ehEDE",
      v: "weekly",
      language: "es",
      region: "US"
    });
  </script>

    <!-- Pre-bundled app (esbuild, minified). Source: em-app.jsx -->
  <script src="app.min.js"></script>

  <!-- Service worker registration. The SW handles cache busting for fresh
       deploys (network-first on HTML/JS) and offline support (cache-first
       for assets). When a new SW becomes waiting, we just reload — without
       in-app banner integration the user gets the new version on the next
       refresh / app re-open / focus-back from background. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          window.__SW_REGISTRATION = reg;
          // When a new SW takes control, reload once so the user sees the
          // freshest assets without manual intervention.
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
          // If a new SW is already waiting at mount time, activate it now.
          if (reg.waiting) {
            reg.waiting.postMessage('SKIP_WAITING');
          }
          // Watch for new versions and activate them as soon as installed.
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage('SKIP_WAITING');
              }
            });
          });
          // Trigger update checks: now, on focus, and every 5 minutes.
          const checkForUpdate = () => reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
          setInterval(checkForUpdate, 5 * 60 * 1000);
        }).catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
