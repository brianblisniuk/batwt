<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
  <meta name="theme-color" content="#0A1430"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Expedición Mundial"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Expedición Mundial</title>

  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#0A1430; --surface:#FFFFFF; --surface-dim:#F4F6FA;
      --text:#0A1430; --text-muted:#5C6680; --text-dim:#9099B0;
      --border:rgba(15,23,42,0.08);
      --primary:#1E3FB8; --primary-deep:#0A1F70; --accent:#75AADB;
      --good:#0E9F6E; --warn:#F59E0B; --bad:#DC2626;
      --on-bg:#EAF0FF; --on-bg-dim:#8A97BD;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;font-family:'Inter',-apple-system,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overscroll-behavior:none;}
    body{overflow-x:hidden;}
    h1,h2,h3,h4{font-family:'Inter Tight','Inter',sans-serif;margin:0;letter-spacing:-0.01em;}
    button,input{font-family:inherit;}
    *::-webkit-scrollbar{height:0;width:0;}
    #root{min-height:100vh;min-height:100dvh;}
    a{color:inherit;}
    .safe-top{padding-top:max(14px,env(safe-area-inset-top));}
    .safe-bottom{padding-bottom:max(14px,env(safe-area-inset-bottom));}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spin{animation:spin .9s linear infinite;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

    /* ===== Splash / loading ===== */
    .center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;}
    .ring{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;}

    /* ===== Entry screen ===== */
    .entry{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:32px 26px;
      background:radial-gradient(120% 80% at 50% 0%, #14245A 0%, var(--bg) 60%);}
    .entry .badge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
      background:linear-gradient(150deg,var(--primary),var(--primary-deep));box-shadow:0 12px 30px rgba(10,31,112,.5);}
    .entry h1{color:var(--on-bg);font-size:25px;font-weight:800;}
    .entry p{color:var(--on-bg-dim);font-size:14.5px;line-height:1.5;max-width:300px;margin:0;}
    .code-input{width:100%;max-width:300px;text-align:center;letter-spacing:.32em;font-weight:800;font-size:26px;
      font-family:'Inter Tight',monospace;text-transform:uppercase;color:var(--on-bg);
      background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 12px;outline:none;}
    .code-input:focus{border-color:var(--accent);background:rgba(255,255,255,.09);}
    .code-input::placeholder{color:rgba(255,255,255,.22);letter-spacing:.32em;}
    .btn-primary{width:100%;max-width:300px;border:none;border-radius:13px;padding:15px;font-weight:700;font-size:15.5px;color:#fff;
      background:var(--primary);cursor:pointer;transition:filter .15s,transform .05s;}
    .btn-primary:active{transform:translateY(1px);}
    .btn-primary:disabled{opacity:.5;cursor:default;}
    .err{color:#FFB4B4;font-size:13.5px;min-height:18px;}

    /* ===== Trip header ===== */
    .wrap{max-width:560px;margin:0 auto;padding-bottom:96px;}
    .hero{background:linear-gradient(155deg,#15265E 0%,#0A1430 70%);color:var(--on-bg);padding:0 20px 22px;}
    .hero .kicker{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
    .hero h1{font-size:26px;font-weight:800;margin-top:6px;line-height:1.12;}
    .hero .sub{font-size:13.5px;color:var(--on-bg-dim);margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
    .countdown{display:inline-flex;align-items:baseline;gap:6px;background:rgba(117,170,219,.16);border:1px solid rgba(117,170,219,.3);
      color:#CFE2F6;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;}
    .countdown b{font-family:'Inter Tight';font-size:15px;font-weight:800;color:#fff;}

    /* ===== Day cards ===== */
    .body{background:var(--surface-dim);border-radius:22px 22px 0 0;margin-top:-14px;padding:20px 14px 8px;min-height:60vh;}
    .day{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin:0 0 14px;overflow:hidden;
      box-shadow:0 1px 2px rgba(15,23,42,.04);animation:fadeUp .35s ease both;}
    .day-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
    .day-num{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;
      font-family:'Inter Tight';font-weight:800;font-size:17px;line-height:1;}
    .day-num small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.08em;opacity:.85;margin-bottom:2px;}
    .day-meta .dow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}
    .day-meta .ttl{font-size:16px;font-weight:700;color:var(--text);margin-top:1px;line-height:1.2;}
    .day-sum{padding:10px 16px 0;color:var(--text-muted);font-size:13.5px;line-height:1.45;}

    .slot{display:flex;gap:12px;padding:13px 16px;border-top:1px dashed var(--border);}
    .slot:first-child{border-top:none;}
    .slot-time{flex:none;width:52px;text-align:right;font-family:'Inter Tight';font-weight:700;font-size:13px;color:var(--primary);padding-top:1px;}
    .slot-time .end{display:block;font-size:10.5px;font-weight:600;color:var(--text-dim);}
    .slot-body{flex:1;min-width:0;}
    .slot-title{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.25;}
    .slot-desc{font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:3px;white-space:pre-wrap;}
    .prov{margin-top:8px;background:var(--surface-dim);border:1px solid var(--border);border-radius:11px;padding:9px 11px;}
    .prov-name{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
    .prov-addr{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
    .prov-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;text-decoration:none;
      border:1px solid var(--border);border-radius:999px;padding:5px 10px;color:var(--primary);background:#fff;}
    .chip.solid{background:var(--primary);color:#fff;border-color:var(--primary);}
    .att{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
    .att a{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-decoration:none;color:var(--primary-deep);
      background:rgba(30,63,184,.07);border:1px solid rgba(30,63,184,.16);border-radius:9px;padding:6px 10px;}

    /* ===== Map ===== */
    #map{width:100%;height:calc(100dvh - 140px);border-radius:18px;overflow:hidden;}
    .map-wrap{padding:14px;}

    /* ===== Bottom nav ===== */
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,20,48,.92);backdrop-filter:blur(12px);
      border-top:1px solid rgba(255,255,255,.08);display:flex;}
    .nav button{flex:1;background:none;border:none;color:var(--on-bg-dim);padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
      font-size:10.5px;font-weight:600;cursor:pointer;}
    .nav button.active{color:#fff;}
    .nav .ico{width:22px;height:22px;}
    .install{position:fixed;right:14px;z-index:45;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--accent);color:#06122E;
      border:none;border-radius:999px;padding:11px 16px;font-weight:800;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.35);cursor:pointer;}
    .stale{margin:0 14px 12px;background:#FFF7E6;border:1px solid #F6E0A8;color:#8A6100;border-radius:10px;padding:8px 12px;font-size:12px;}
  </style>
</head>

</html>
