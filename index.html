<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0A1430"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Expedición Mundial"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Expedición Mundial</title>

  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=15"/>
</head>
<body>

  <!-- ENTRADA POR CÓDIGO -->
  <div id="entry" class="entry" hidden>
    <div class="mark">EM</div>
    <h1>Expedición Mundial</h1>
    <p>Ingresá el código de acceso que te compartimos para ver tu viaje.</p>
    <input id="codeInput" class="code-input" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX"/>
    <div class="err" id="codeErr"></div>
    <button id="codeBtn" class="btn-cta" disabled>Ver mi viaje</button>
  </div>

  <!-- LOADING -->
  <div id="loading" class="center" hidden>
    <div class="ring"></div>
    <div style="color:#8A97BD;font-size:14px;">Cargando tu viaje…</div>
  </div>

  <!-- APP -->
  <div id="app" class="app" hidden>

    <!-- Top bar (escritorio) -->
    <header class="topbar">
      <div class="brand"><span class="m">EM</span> EXPEDICIÓN MUNDIAL</div>
      <nav id="topNav">
        <button data-tab="overview" class="active">Mi Viaje</button>
        <button data-tab="itinerary">Itinerario</button>
        <button data-tab="mapa">Mapa</button>
        <button data-tab="mundial">Mundial</button>
        <button data-tab="accesos">Accesos</button>
      </nav>
      <div class="cd" id="topCountdown"></div>
    </header>

    <div id="staleBanner" class="stale" hidden>Mostrando datos guardados (sin conexión). Se actualiza al reconectar.</div>

    <!-- MI VIAJE -->
    <section class="screen active" id="overview">
      <div id="overviewHeader"></div>
      <div class="screen-body" id="overviewBody"></div>
    </section>

    <!-- ITINERARIO -->
    <section class="screen" id="itinerary">
      <div class="bar"><h2>Itinerario</h2><div class="sub" id="itiSub"></div></div>
      <div class="iti-wrap">
        <nav class="date-scroller" id="dateScroller"></nav>
        <div class="iti-body" id="dayContent"></div>
      </div>
    </section>

    <!-- MUNDIAL -->
    <section class="screen" id="mundial">
      <div class="bar"><h2>Mundial 2026</h2><div class="sub" id="mundialSub"></div></div>
      <div class="screen-body">
        <div class="mundial-filters">
          <button class="filter-chip active" data-filter="all">Todos</button>
          <button class="filter-chip" data-filter="arg">🇦🇷 Argentina</button>
          <button class="filter-chip" data-filter="trip">En tu viaje</button>
        </div>
        <div id="matchList"></div>
      </div>
    </section>

    <!-- MAPA -->
    <section class="screen" id="mapa">
      <div class="bar"><h2>Mapa</h2><div class="sub" id="mapSub"></div></div>
      <div class="map-wrap">
        <div id="mapDayStrip" class="map-daystrip"></div>
        <div id="map"></div>
        <div id="mapBanner" class="map-banner"></div>
      </div>
    </section>

    <!-- ACCESOS DIRECTOS -->
    <section class="screen" id="accesos">
      <div class="bar"><h2>Accesos Directos</h2><div class="sub">Apps del viaje</div></div>
      <div class="screen-body" id="accesosBody"></div>
    </section>

    <!-- DETALLE DE SLOT -->
    <section class="screen" id="detail">
      <button class="detail-back-fab" id="detailBackFab" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div id="detailContent"></div>
    </section>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav" id="bottomNav">
      <button data-tab="overview" class="active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-3v-7H8v7H5a2 2 0 01-2-2v-9z"/></svg>
        <span>Mi Viaje</span>
      </button>
      <button data-tab="itinerary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Itinerario</span>
      </button>
      <button data-tab="mapa">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3L3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path d="M9 3v16M15 5v16"/></svg>
        <span>Mapa</span>
      </button>
      <button data-tab="mundial">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>
        <span>Mundial</span>
      </button>
      <button data-tab="accesos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Accesos</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key:"AIzaSyCUeZyKs2jjtKLNIwHq9V7Caw2bW_ehEDE", v:"weekly", language:"es", region:"US"
    });
  </script>
  <script src="app.js?v=15"></script>
  <script>
    if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
  </script>
</body>
</html>
